spring:
  application:
    name: code-duel-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/codeduel
    username: postgres
    password: password # Cámbialo si es necesario
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

