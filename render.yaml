services:
  - type: web
    name: code-duel
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: code-duel-db
          property: jdbcUrl
      - key: JDBC_DATABASE_USERNAME
        fromDatabase:
          name: code-duel-db
          property: user
      - key: JDBC_DATABASE_PASSWORD
        fromDatabase:
          name: code-duel-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: WS_ALLOWED_ORIGINS
        value: ""

databases:
  - name: code-duel-db
    plan: free
