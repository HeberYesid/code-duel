services:
  - type: web
    name: code-duel
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JDBC_DATABASE_HOST
        sync: false
      - key: JDBC_DATABASE_PORT
        value: "5432"
      - key: JDBC_DATABASE_NAME
        value: "neondb"
      - key: JDBC_DATABASE_USERNAME
        sync: false
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: WS_ALLOWED_ORIGINS
        value: ""
